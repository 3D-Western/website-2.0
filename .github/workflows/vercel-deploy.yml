# Deploys this repo to Vercel (project "website-2-0" (www.3dwestern.ca) in the free "3DW Projects"
# team) straight from the org, for any contributor:
#   - push to main  -> production deploy
#   - pull request  -> preview deploy, link posted on the PR (PRs from forks are skipped:
#                      they cannot read secrets)
#   - manual run    -> Actions > Vercel deploy > Run workflow (production)
# The build runs on Vercel with the project's environment variables (no GitHub Actions
# build minutes). Vercel's own Git integration is disconnected on purpose: on the free
# Hobby plan it only deploys commits authored by the 3DWestern account, while a deploy
# with the team token works for everyone.
# Needs: secret VERCEL_TOKEN (Vercel token scoped to "3DW Projects"), variables
# VERCEL_ORG_ID and VERCEL_PROJECT_ID.
name: Vercel deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: vercel-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Deploy
        id: deploy
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then PROD=""; else PROD="--prod"; fi
          url=$(npx --yes vercel@latest deploy $PROD --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Post the preview link on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\n**Vercel preview:** ${{ steps.deploy.outputs.url }}\n\nCommit ${context.payload.pull_request.head.sha.slice(0, 7)}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.body && c.body.includes(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
